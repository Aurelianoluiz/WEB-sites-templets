name: CM Comercial Release Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'cm-comercial-v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build safe release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/package/CM-Comercial
          rsync -a CM-Comercial/ dist/package/CM-Comercial/ \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='data/*.sqlite' \
            --exclude='data/*.sqlite3' \
            --exclude='data/*.db' \
            --exclude='data/*.log' \
            --exclude='uploads/*' \
            --exclude='BACKUP/'
          (cd dist/package && zip -qr ../CM-Comercial-release.zip CM-Comercial)
          unzip -tq dist/CM-Comercial-release.zip
          if unzip -l dist/CM-Comercial-release.zip | grep -Eq '(^|/)(\.env|\.env\.|.*\.sqlite3?|.*\.db|.*\.log)($|/)' ; then
            echo 'FAIL: sensitive artifact detected in release ZIP'
            exit 1
          fi
          sha256sum dist/CM-Comercial-release.zip | tee dist/CM-Comercial-release.zip.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cm-comercial-release
          path: |
            dist/CM-Comercial-release.zip
            dist/CM-Comercial-release.zip.sha256
          if-no-files-found: error
          retention-days: 30
