name: CM Comercial PHP Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'CM-Comercial/**'
      - '.github/workflows/cm-comercial-php.yml'
  pull_request:
    paths:
      - 'CM-Comercial/**'
      - '.github/workflows/cm-comercial-php.yml'

permissions:
  contents: read

jobs:
  php-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        working-directory: CM-Comercial
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find CM-Comercial -type f -name '*.php' ! -path 'CM-Comercial/.git/*' ! -path 'CM-Comercial/vendor/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No PHP files found.'
            exit 1
          fi
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Enterprise architecture smoke test
        run: php CM-Comercial/tests/enterprise_architecture_test.php

      - name: Run deterministic validation runner
        run: php CM-Comercial/tests/validation_runner.php

      - name: Verify release consistency
        run: php CM-Comercial/tests/release_consistency.php

      - name: Release gate assets
        run: php CM-Comercial/tests/release_gate.php
