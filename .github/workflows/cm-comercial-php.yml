name: CM Comercial PHP Validation

on:
  push:
    paths:
      - 'CM-Comercial/**'
      - '.github/workflows/cm-comercial-php.yml'
  pull_request:
    paths:
      - 'CM-Comercial/**'
      - '.github/workflows/cm-comercial-php.yml'

permissions:
  contents: read

jobs:
  php-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find CM-Comercial -type f -name '*.php' \
            ! -path 'CM-Comercial/.git/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No PHP files found.'
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Run isolated domain tests
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            CM-Comercial/tests/payment_core_test.php \
            CM-Comercial/tests/payment_service_test.php \
            CM-Comercial/tests/customer_financial_history_test.php \
            CM-Comercial/tests/integration_suite.php; do
            if [ -f "$test" ]; then
              echo "Running $test"
              php "$test"
            fi
          done

      - name: Run security audit when dependencies are present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f CM-Comercial/tests/security_audit.php ]; then
            php CM-Comercial/tests/security_audit.php
          fi
